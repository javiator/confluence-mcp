
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcoreconfluence"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "aws-opentelemetry-distro >= 0.10.0",
    "bedrock-agentcore >= 1.0.12",
    "langchain >= 0.3.0",
    "langchain-mcp-adapters >= 0.1.11",
    "langchain_aws >= 0.2.0",
    "langgraph >= 0.2.0",
    "langgraph-checkpoint-aws >= 1.0.1",
    "mcp >= 1.19.0",
    "mcp-proxy-for-aws >= 0.1.0",
    "pytest >= 7.0.0",
    "pytest-asyncio >= 0.21.0",
    "python-dotenv >= 1.2.1",
    "tiktoken==0.11.0"
]